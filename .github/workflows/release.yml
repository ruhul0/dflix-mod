name: Build & release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleSideloadRelease bundlePlayRelease --no-daemon

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          # Fixed asset name keeps .../releases/latest/download/dflix-tv.apk stable for manual installs.
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk dflix-tv.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab dflix-tv-play.aab
          gh release create "$TAG" dflix-tv.apk dflix-tv-play.aab \
            --title "DFLIX TV $TAG" \
            --notes "$(git log -1 --pretty=%B)" \
            --target "$GITHUB_SHA"

      # Runs once the PLAY_SERVICE_ACCOUNT_JSON secret exists. The very first AAB must be
      # uploaded by hand in Play Console; the API can't create the app.
      - name: Upload to Google Play (internal testing)
        if: env.PLAY_JSON != ''
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dflixtv.app.play
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          track: internal
          # "draft" until the app's first release is rolled out in Play Console; then set the
          # PLAY_RELEASE_STATUS repository variable to "completed".
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
